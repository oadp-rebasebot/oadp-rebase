name: Config Tests

on:
  pull_request:
    branches: [oadp-dev]
    paths:
      - 'repos.yaml'
      - 'versions/**'
      - 'rebase-configs/**'
      - 'rebasebot-hook-scripts/**'
      - 'run-oadp-rebase.sh'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/config-tests.yaml'
  push:
    branches: [oadp-dev]
    paths:
      - 'repos.yaml'
      - 'versions/**'
      - 'rebase-configs/**'
      - 'rebasebot-hook-scripts/**'
      - 'run-oadp-rebase.sh'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/config-tests.yaml'

permissions:
  contents: read

jobs:
  verify-generate:
    name: Verify generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Verify generated files match SSOT
        run: make verify-generate

  syntax-check:
    name: Shell syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check versions files
        run: |
          for f in versions/*.env; do
            bash -n "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All versions files OK"

      - name: Check rebase configs
        run: |
          for f in rebase-configs/*.env.sh; do
            bash -n "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All config files OK"

      - name: Check hook scripts
        run: |
          for f in rebasebot-hook-scripts/*.sh; do
            bash -n "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All hook scripts OK"

      - name: Check run-oadp-rebase.sh
        run: bash -n run-oadp-rebase.sh

      - name: Check tool scripts
        run: |
          for f in tools/*.sh tools/**/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All tool scripts OK"

  config-load:
    name: Config loading test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Test all configs load correctly
        run: make config-load

      - name: Verify hook references exist
        run: |
          missing=0
          for config in rebase-configs/*.env.sh; do
            while IFS= read -r hook; do
              [ -z "$hook" ] && continue
              if [ ! -f "rebasebot-hook-scripts/$hook" ]; then
                echo "MISSING: $hook (in $(basename "$config"))"
                missing=$((missing+1))
              fi
            done < <(grep -o '/[a-zA-Z0-9_.-]*\.sh' "$config" | sed 's|^/||')
          done
          if [ $missing -gt 0 ]; then
            echo "❌ $missing hook reference(s) broken"
            exit 1
          fi
          echo "✅ All hook references valid"

  kopia-alignment:
    name: Kopia version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify kopia tags match Velero go.mod
        env:
          GH_TOKEN: ${{ github.token }}
        run: make verify-kopia-alignment
