name: Config Tests

on:
  pull_request:
    branches: [oadp-dev]
    paths:
      - 'repos.yaml'
      - 'versions/**'
      - 'rebase-configs/**'
      - 'rebasebot-hook-scripts/**'
      - 'run-oadp-rebase.sh'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.shellcheckrc'
      - '.github/workflows/config-tests.yaml'
      - '.github/workflows/cve-scan.yaml'
      - '.github/workflows/auto-rebase-v2.yaml'
      - '.github/workflows/publish-dashboard-data.yaml'
      - '.github/workflows/chai-trigger.yaml'
      - '.github/workflows/stream-sync.yaml'
  push:
    branches: [oadp-dev]
    paths:
      - 'repos.yaml'
      - 'versions/**'
      - 'rebase-configs/**'
      - 'rebasebot-hook-scripts/**'
      - 'run-oadp-rebase.sh'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.shellcheckrc'
      - '.github/workflows/config-tests.yaml'
      - '.github/workflows/cve-scan.yaml'
      - '.github/workflows/auto-rebase-v2.yaml'
      - '.github/workflows/publish-dashboard-data.yaml'
      - '.github/workflows/chai-trigger.yaml'
      - '.github/workflows/stream-sync.yaml'

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        uses: mikefarah/yq@v4.46.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run all checks
        run: make test

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint shell scripts
        run: make shellcheck

  kopia-alignment:
    name: Kopia version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify kopia tags match Velero go.mod
        env:
          GH_TOKEN: ${{ github.token }}
        run: make verify-kopia-alignment

  tide-sync:
    # Non-blocking on purpose: it clones openshift/release live, so that
    # repo's state (or a network blip) must not fail unrelated PRs. It is
    # the alarm for "the release queries lag the declared streams".
    name: Tide-sync drift alarm
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Release queries carry every declared stream
        run: make tide-sync-test
