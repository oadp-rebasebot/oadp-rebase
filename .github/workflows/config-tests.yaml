name: Config Tests

on:
  pull_request:
    branches: [oadp-dev]
    paths:
      - 'repos.yaml'
      - 'versions/**'
      - 'rebase-configs/**'
      - 'rebasebot-hook-scripts/**'
      - 'run-oadp-rebase.sh'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/config-tests.yaml'
  push:
    branches: [oadp-dev]
    paths:
      - 'repos.yaml'
      - 'versions/**'
      - 'rebase-configs/**'
      - 'rebasebot-hook-scripts/**'
      - 'run-oadp-rebase.sh'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/config-tests.yaml'

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        uses: mikefarah/yq@v4.46.1

      - name: Run all checks
        run: make test

  kopia-alignment:
    name: Kopia version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify kopia tags match Velero go.mod
        env:
          GH_TOKEN: ${{ github.token }}
        run: make verify-kopia-alignment
