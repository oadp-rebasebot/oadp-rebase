name: Chai Trigger

# A comment in structured JSON on an issue labeled `chai-trigger`, posted by
# redhat-chai-bot, starts the CVE scan and/or the Auto Rebase workflow.
# This is chai's trigger path (migtools/oadp-agentic T36): chai holds no
# dispatch credential -- it comments with the GitHub account it already
# has, and this workflow dispatches its siblings with the builtin
# GITHUB_TOKEN (same-repo workflow_dispatch needs no PAT).

on:
  issue_comment:
    types: [created]

permissions:
  # workflow_dispatch of sibling workflows in this repository.
  actions: write
  # The acknowledgment comment on the trigger issue.
  issues: write

concurrency:
  group: chai-trigger
  cancel-in-progress: false

jobs:
  trigger:
    # Only chai's account, only on an issue a maintainer labeled as a
    # trigger (the label is the opt-in; an unlabeled issue never fires).
    if: >-
      github.event.comment.user.login == 'redhat-chai-bot' &&
      contains(github.event.issue.labels.*.name, 'chai-trigger')
    runs-on: ubuntu-latest
    env:
      MARKER: chai:workflow-trigger:v1
    steps:
      - name: Parse the trigger comment
        id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          # The jq programs below are single-quoted on purpose: their $ are
          # jq syntax (regex anchors, --arg references), not shell expansion.
          # shellcheck disable=SC2016
          set -euo pipefail

          # The marker must be present: anyone can write JSON, only chai's
          # comments carry this hidden marker line.
          grep -q "<!-- $MARKER -->" <<< "$COMMENT" || {
            echo "No trigger marker; ignoring." >&2
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # The JSON is the fenced block after the marker (a comment may
          # carry prose around it).
          # Both extractions are failure-tolerant: a marked comment with no
          # JSON must reach the schema check and be refused, not kill the
          # step before valid=false is written (set -euo pipefail).
          PAYLOAD=$(sed -n '/<!-- '"$MARKER"' -->/,/^```$/p' <<< "$COMMENT" \
            | sed -n '/^```json\{0,1\}$/,/^```$/p' | sed '1d;$d' || true)
          [ -n "$PAYLOAD" ] || PAYLOAD=$(grep -o '{.*}' <<< "$COMMENT" | head -1 || true)
          [ -n "$PAYLOAD" ] || {
            echo "Marker present but no JSON payload." >&2
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          echo "$PAYLOAD" | jq -e '
            type == "object"
            and (.trigger == "cve_scan" or .trigger == "rebase" or .trigger == "cve_scan_then_rebase")
            and ((.waves // "") | test("^[1-5]$"))
            and .dry_run == true
            and ([.oadp_1_4, .oadp_1_5, .oadp_1_6, .oadp_dev]
                 | all(. == null or . == true or . == false))
          ' > /dev/null || {
            echo "Comment did not parse as a valid trigger." >&2
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          SELECTED=$(jq -r '[.oadp_1_4, .oadp_1_5, .oadp_1_6, .oadp_dev]
            | map(select(. == true)) | length' <<< "$PAYLOAD")
          [ "$SELECTED" -gt 0 ] || {
            echo "No branch selected." >&2
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          {
            echo "valid=true"
            echo "trigger=$(jq -r .trigger <<< "$PAYLOAD")"
            echo "waves=$(jq -r .waves <<< "$PAYLOAD")"
            echo "dry_run=$(jq -r .dry_run <<< "$PAYLOAD")"
            for b in oadp_1_4 oadp_1_5 oadp_1_6 oadp_dev; do
              v=$(jq -r --arg b "$b" '.[$b] // false' <<< "$PAYLOAD")
              echo "$b=$v"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge (invalid)
        if: steps.parse.outputs.valid != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='confused' > /dev/null || true

      - name: Snapshot existing runs
        id: snap
        if: steps.parse.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Correlation base for the wait gate and the acknowledgment:
          # whatever dispatch runs appear after this snapshot were created
          # by this trigger (a racing dispatch serializes behind ours).
          {
            echo "scan=$(gh run list --workflow cve-scan.yaml --event workflow_dispatch \
              --limit 100 --json databaseId --jq 'map(.databaseId|tostring)|join(",")' || echo 0)"
            echo "rebase=$(gh run list --workflow auto-rebase-v2.yaml --event workflow_dispatch \
              --limit 100 --json databaseId --jq 'map(.databaseId|tostring)|join(",")' || echo 0)"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch CVE scan
        if: >-
          steps.parse.outputs.valid == 'true' &&
          (steps.parse.outputs.trigger == 'cve_scan' ||
           steps.parse.outputs.trigger == 'cve_scan_then_rebase')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GH_REPO is set: gh needs it when no checkout ran.
          gh workflow run cve-scan.yaml --ref oadp-dev \
            -f oadp_1_4="${{ steps.parse.outputs.oadp_1_4 }}" \
            -f oadp_1_5="${{ steps.parse.outputs.oadp_1_5 }}" \
            -f oadp_1_6="${{ steps.parse.outputs.oadp_1_6 }}" \
            -f oadp_dev="${{ steps.parse.outputs.oadp_dev }}" \
            -f waves="${{ steps.parse.outputs.waves }}" \
            -f dry_run="${{ steps.parse.outputs.dry_run }}"
          echo "CVE scan dispatched."

      - name: Wait for the CVE scan (rebase runs after it)
        id: wait
        if: >-
          steps.parse.outputs.valid == 'true' &&
          steps.parse.outputs.trigger == 'cve_scan_then_rebase'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The scan commits dependency bumps the rebase then carries; it
          # runs first. Correlate by difference, not by recency: snapshot
          # the dispatch runs that exist, then wait for every NEW dispatch
          # run to finish. cve-scan's concurrency group serializes runs, so
          # a dispatch racing ours queues behind it -- requiring all new
          # runs to succeed never lets a failed scan carry into the rebase,
          # and never skips ours because a newer run appeared.
          BEFORE=${{ steps.snap.outputs.scan }}
          echo "Dispatch runs before this trigger: $BEFORE"

          deadline=$((SECONDS + 7200))
          while :; do
            RUNS=$(gh run list --workflow cve-scan.yaml --event workflow_dispatch \
              --limit 100 --json databaseId,status,conclusion)
            NEW=$(jq --arg b "$BEFORE" \
              'map(select(((.databaseId|tostring) as $i) | ($b|split(",")) | index($i) | not))' \
              <<< "$RUNS")
            COUNT=$(jq length <<< "$NEW")
            if [ "$COUNT" -eq 0 ]; then
              echo "Our scan run is not listed yet; waiting."
            else
              FAILED=$(jq '[.[]|select(.conclusion=="failure")]|length' <<< "$NEW")
              RUNNING=$(jq '[.[]|select(.status!="completed")]|length' <<< "$NEW")
              if [ "$FAILED" -gt 0 ]; then
                jq -r '.[]|select(.conclusion=="failure")|"CVE scan run \(.databaseId) failed; not dispatching the rebase."' <<< "$NEW" >&2
                exit 1
              fi
              [ "$RUNNING" -eq 0 ] && break
              echo "$RUNNING new scan run(s) still running; waiting."
            fi
            [ "$SECONDS" -gt "$deadline" ] && { echo "Timed out waiting for the CVE scan." >&2; exit 1; }
            sleep 30
          done

          # A green conclusion is not a green scan: scan-repo.sh swallows
          # clone and Trivy failures (ScanFailed:true, exit 0). The runs'
          # own warning lines are the failure marker.
          for rid in $(jq -r '.[].databaseId' <<< "$NEW"); do
            if gh run view "$rid" --log 2>/dev/null | grep -qE '::warning::(Failed to clone|Trivy scan failed)'; then
              echo "CVE scan run $rid reported a failed repository scan; not dispatching the rebase." >&2
              exit 1
            fi
          done

          echo "scan_runs=$(jq -r 'map(.databaseId|tostring)|join(",")' <<< "$NEW")" >> "$GITHUB_OUTPUT"
          echo "All new CVE scan runs succeeded, no repository scan failed."

      - name: Dispatch Auto Rebase
        if: >-
          steps.parse.outputs.valid == 'true' &&
          (steps.parse.outputs.trigger == 'rebase' ||
           steps.parse.outputs.trigger == 'cve_scan_then_rebase')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run auto-rebase-v2.yaml --ref oadp-dev \
            -f oadp_1_4="${{ steps.parse.outputs.oadp_1_4 }}" \
            -f oadp_1_5="${{ steps.parse.outputs.oadp_1_5 }}" \
            -f oadp_1_6="${{ steps.parse.outputs.oadp_1_6 }}" \
            -f oadp_dev="${{ steps.parse.outputs.oadp_dev }}" \
            -f waves="${{ steps.parse.outputs.waves }}" \
            -f dry_run="${{ steps.parse.outputs.dry_run }}"
          echo "Auto Rebase dispatched."

      - name: Acknowledge (dispatched)
        if: steps.parse.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TRIGGER: ${{ steps.parse.outputs.trigger }}
          WAVES: ${{ steps.parse.outputs.waves }}
          DRY_RUN: ${{ steps.parse.outputs.dry_run }}
          SCAN_RUNS: ${{ steps.wait.outputs.scan_runs }}
          SNAP_SCAN: ${{ steps.snap.outputs.scan }}
          SNAP_REBASE: ${{ steps.snap.outputs.rebase }}
        run: |
          sleep 15
          # Link the runs this trigger created (snapshot diff), never a
          # re-queried newest run that may belong to a manual or
          # merge-watch dispatch.
          new_urls() {
            local workflow="$1" before="$2"
            gh run list --workflow "$workflow" --event workflow_dispatch \
              --limit 100 --json databaseId,url \
              | jq -r --arg b "$before" \
                'map(select(((.databaseId|tostring) as $i) | ($b|split(",")) | index($i) | not)) | .[].url'
          }
          {
            echo "Triggered \`$TRIGGER\` (wave $WAVES, dry_run=$DRY_RUN)."
            if [ -n "$SCAN_RUNS" ] && [ "$SCAN_RUNS" != "0" ]; then
              for rid in ${SCAN_RUNS//,/ }; do
                echo "- CVE scan: $(gh run view "$rid" --json url --jq .url)"
              done
            else
              while IFS= read -r u; do echo "- CVE scan: $u"; done \
                < <(new_urls cve-scan.yaml "$SNAP_SCAN")
            fi
            while IFS= read -r u; do echo "- Auto Rebase: $u"; done \
              < <(new_urls auto-rebase-v2.yaml "$SNAP_REBASE")
          } > /tmp/ack.md
          gh issue comment "$ISSUE" --body-file /tmp/ack.md
