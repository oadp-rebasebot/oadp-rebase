name: Auto Rebase

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branches to process (comma-separated, or "all")'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run (no PRs created)'
        required: false
        type: boolean
        default: false


permissions:
  contents: read

concurrency:
  group: auto-rebase
  cancel-in-progress: false

env:
  GITHUB_APP_ID: '1810299'

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_targets: ${{ steps.build-matrix.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: tools/rebase-status/go.sum

      - name: Build rebase-status
        run: make -C tools/rebase-status rebase-status

      - name: Determine targets
        id: build-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BRANCHES: ${{ inputs.branches }}
        run: |
          if [ "$INPUT_BRANCHES" = "all" ] || [ -z "$INPUT_BRANCHES" ]; then
            BRANCHES="oadp-1.6"
          else
            BRANCHES=$(echo "$INPUT_BRANCHES" | tr ',' ' ')
          fi

          all_targets='[]'

          for branch in $BRANCHES; do
            echo "::group::rebase-status $branch"

            json_file="/tmp/status-${branch}.json"
            tools/rebase-status/rebase-status \
              --config-dir rebase-configs \
              --json \
              --hide-dependency-details \
              "$branch" > "$json_file" || true

            targets=$(bash tools/auto-rebase/rebase-decision.sh --reason < "$json_file")
            count=$(echo "$targets" | grep -c . || echo 0)
            echo "Branch $branch: $count target(s)"

            while IFS=$(printf '\t') read -r target reason; do
              [ -z "$target" ] && continue
              all_targets=$(echo "$all_targets" | jq \
                --arg branch "$branch" \
                --arg target "$target" \
                --arg reason "$reason" \
                '. + [{"branch": $branch, "target": $target, "reason": $reason}]')
            done <<< "$targets"

            echo "::endgroup::"
          done

          total=$(echo "$all_targets" | jq length)
          echo "Total targets across all branches: $total"

          if [ "$total" -gt 0 ]; then
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          fi

          matrix=$(echo "$all_targets" | jq -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          # Write decision summary to job summary
          echo "## Rebase Decision Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for branch in $BRANCHES; do
            json_file="/tmp/status-${branch}.json"
            [ -f "$json_file" ] || continue

            echo "### Branch: \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Selected targets
            selected=$(echo "$all_targets" | jq -r ".[] | select(.branch == \"$branch\") | \"| \(.target) | \(.reason) |\"")
            if [ -n "$selected" ]; then
              echo "**Selected for rebase:**" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "| Target | Reason |" >> "$GITHUB_STEP_SUMMARY"
              echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
              echo "$selected" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**No targets selected for rebase.**" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Skipped repos with reasons
            skipped=$(jq -r "
              [ .[] |
                select(.skip == true) |
                {repo: (.repo | split(\"/\") | .[1]), reason: \"skip=true\"}
              ] + [ .[] |
                select(.skip != true) |
                select(.checks.config.status != \"ok\") |
                {repo: (.repo | split(\"/\") | .[1]), reason: \"no rebase config\"}
              ] + [ .[] |
                select(.skip != true) |
                select(.checks.config.status == \"ok\") |
                select(.checks.open_pr.status == \"ok\") |
                {repo: (.repo | split(\"/\") | .[1]), reason: \"open PR exists\"}
              ] + [ .[] |
                select(.skip != true) |
                select(.checks.config.status == \"ok\") |
                select(.checks.open_pr.status != \"ok\") |
                select(.wave >= 2) |
                select(.checks.dep_sync.status != \"fail\") |
                {repo: (.repo | split(\"/\") | .[1]), reason: \"deps in sync\"}
              ] | sort_by(.repo) | .[] | \"| \(.repo) | \(.reason) |\"
            " < "$json_file")

            if [ -n "$skipped" ]; then
              echo "**Skipped:**" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "| Repo | Reason |" >> "$GITHUB_STEP_SUMMARY"
              echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
              echo "$skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

  rebase:
    needs: decide
    if: needs.decide.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.decide.outputs.matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup secrets
        env:
          APP_KEY: ${{ secrets.OADP_REBASEBOT_APP_KEY }}
          CLONER_KEY: ${{ secrets.OADP_REBASEBOT_CLONER_KEY }}
        run: |
          mkdir -p /tmp/rebasebot-secrets
          echo "$APP_KEY" > /tmp/rebasebot-secrets/oadp-rebasebot-app-key
          echo "$CLONER_KEY" > /tmp/rebasebot-secrets/oadp-rebasebot-cloner-key
          chmod 600 /tmp/rebasebot-secrets/*

      # ── Phase 1: Dry-run ────────────────────────────────────────
      - name: Dry-run rebasebot (strict) for ${{ matrix.target }}
        id: dry-run
        continue-on-error: true
        env:
          SECRETS_DIR: /tmp/rebasebot-secrets
          TARGET: ${{ matrix.target }}
        run: |
          echo "Target: ${TARGET} (reason: ${{ matrix.reason }})"

          set +e
          ./run-oadp-rebase.sh --dry-run --working-dir /tmp/rebase-workdir "${TARGET}" 2>&1 | tee /tmp/rebase-output.txt
          rc=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" = "0" ]; then
            echo "::notice title=Dry-run Strict (${TARGET})::Succeeded"
          else
            echo "::warning title=Dry-run Strict (${TARGET})::Failed with exit code ${rc}"
          fi

          exit $rc

      - name: Triage conflict
        id: triage
        if: always() && steps.dry-run.outputs.exit_code != '0' && steps.dry-run.outputs.exit_code != ''
        env:
          TARGET: ${{ matrix.target }}
        run: |
          config_name=$(grep -E "^[[:space:]]+${TARGET}\)" run-oadp-rebase.sh | head -1 | sed 's/.*echo "\(.*\)".*/\1/' || true)
          if [ -z "$config_name" ]; then
            echo "::warning::Could not resolve config file for target: ${TARGET}"
            echo 'verdict={"safe": false, "reason": "Could not resolve config file", "affected_files": []}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          verdict=$(bash tools/auto-rebase/conflict-triage.sh "rebase-configs/${config_name}.env.sh" < /tmp/rebase-output.txt)
          triage_rc=$?
          set -e

          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

          reason=$(echo "$verdict" | jq -r '.reason')
          echo "::notice title=Conflict Triage (${TARGET})::${reason}"
          echo "### Conflict Triage Result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run rebasebot with warn policy
        id: dry-run-retry
        continue-on-error: true
        if: always() && steps.dry-run.outputs.exit_code != '0' && steps.triage.outcome == 'success' && fromJSON(steps.triage.outputs.verdict).safe == true
        env:
          SECRETS_DIR: /tmp/rebasebot-secrets
          TARGET: ${{ matrix.target }}
        run: |
          echo "::notice title=Retrying dry-run (${TARGET})::Conflict triage approved retry with --conflict-policy warn"

          set +e
          ./run-oadp-rebase.sh --dry-run --working-dir /tmp/rebase-workdir-retry --conflict-policy warn "$TARGET" 2>&1 | tee /tmp/rebase-output-retry.txt
          rc=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" = "0" ]; then
            echo "::notice title=Dry-run Retry (${TARGET})::Succeeded"
          else
            echo "::warning title=Dry-run Retry (${TARGET})::Failed with exit code ${rc}"
          fi

          exit $rc

      # ── Phase 2: Verify dry-run locally ──────────────────────
      - name: Verify dry-run
        id: verify-dry-run
        continue-on-error: true
        if: always() && (steps.dry-run.outputs.exit_code == '0' || steps.dry-run-retry.outputs.exit_code == '0')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          config_name=$(grep -E "^[[:space:]]+${TARGET}\)" run-oadp-rebase.sh | head -1 | sed 's/.*echo "\(.*\)".*/\1/' || true)
          if [ -z "$config_name" ]; then
            echo "::warning::Could not resolve config for verify: ${TARGET}"
            echo "verify_rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          . "rebase-configs/${config_name}.env.sh"

          upstream_stripped=$(echo "$SOURCE_UPSTREAM_REPO" | sed 's|https://github.com/||')
          upstream_repo=$(echo "$upstream_stripped" | cut -d: -f1)
          upstream_ref=$(echo "$upstream_stripped" | cut -d: -f2)
          dest_repo=$(echo "$DESTINATION_DOWNSTREAM_REPO" | cut -d: -f1)
          dest_branch=$(echo "$DESTINATION_DOWNSTREAM_REPO" | cut -d: -f2)

          # Use the working directory from whichever dry-run succeeded
          repo_name=$(echo "$config_name" | sed -E 's/-(oadp-dev|oadp-1\.[0-9]+|main)$//')
          if [ "${{ steps.dry-run-retry.outputs.exit_code }}" = "0" ]; then
            local_repo="/tmp/rebase-workdir-retry/${repo_name}"
          else
            local_repo="/tmp/rebase-workdir/${repo_name}"
          fi

          echo "Verifying local dry-run: dest=${dest_repo}:${dest_branch} local=${local_repo}:rebase upstream=${upstream_repo}:${upstream_ref}"

          set +e
          bash tools/verify-rebase.sh \
            "$dest_repo" "$dest_branch" \
            "$local_repo" "rebase" \
            "$upstream_repo" "$upstream_ref"
          rc=$?
          set -e

          echo "verify_rc=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" = "0" ]; then
            echo "::notice title=Verify Dry-run (${TARGET})::All carry commits and downstream files preserved"
          else
            echo "::error title=Verify Dry-run (${TARGET})::Verification failed — blocking real run"
          fi

          exit 0

      # ── Phase 3: Real run (gated on dry-run verify) ──────────
      - name: Run rebasebot for ${{ matrix.target }}
        id: run
        continue-on-error: true
        if: always() && steps.verify-dry-run.outputs.verify_rc == '0' && inputs.dry_run != true
        env:
          SECRETS_DIR: /tmp/rebasebot-secrets
          TARGET: ${{ matrix.target }}
        run: |
          conflict_flag=""
          if [ "${{ steps.dry-run-retry.outputs.exit_code }}" = "0" ]; then
            conflict_flag="--conflict-policy warn"
          fi

          set +e
          ./run-oadp-rebase.sh $conflict_flag "${TARGET}" 2>&1 | tee /tmp/rebase-output-real.txt
          rc=${PIPESTATUS[0]}
          set -e

          pr_url=$(grep -oE 'https://github.com/[^[:space:]]+/pull/[0-9]+' /tmp/rebase-output-real.txt | head -1 || echo "")
          pr_info=$(grep -E '(I created a new rebase PR|I updated existing rebase PR|PR .+/pull/[0-9]+ already contains|rebase/manual)' \
            /tmp/rebase-output-real.txt | sed 's/.*INFO - //' | head -1 || echo "")

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_info=$pr_info" >> "$GITHUB_OUTPUT"

          if [ "$rc" = "0" ]; then
            if [ -n "$pr_info" ]; then
              echo "::notice title=Real Run (${TARGET})::${pr_info}"
            else
              echo "::notice title=Real Run (${TARGET})::Succeeded (no PR change)"
            fi
          else
            echo "::warning title=Real Run (${TARGET})::Failed with exit code ${rc}"
          fi

          exit $rc

      # ── Phase 4: Verify pushed result + post to PR ───────────
      - name: Generate app token
        id: app-token
        if: always() && steps.run.outputs.exit_code == '0'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ secrets.OADP_REBASEBOT_APP_KEY }}
          owner: oadp-rebasebot

      - name: Verify rebase
        id: verify
        if: always() && steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
          COMMENT_FILE: /tmp/verify-comment.md
        run: |
          config_name=$(grep -E "^[[:space:]]+${TARGET}\)" run-oadp-rebase.sh | head -1 | sed 's/.*echo "\(.*\)".*/\1/' || true)
          if [ -z "$config_name" ]; then
            echo "::warning::Could not resolve config for verify: ${TARGET}"
            echo "verify_rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          . "rebase-configs/${config_name}.env.sh"

          upstream_stripped=$(echo "$SOURCE_UPSTREAM_REPO" | sed 's|https://github.com/||')
          upstream_repo=$(echo "$upstream_stripped" | cut -d: -f1)
          upstream_ref=$(echo "$upstream_stripped" | cut -d: -f2)
          dest_repo=$(echo "$DESTINATION_DOWNSTREAM_REPO" | cut -d: -f1)
          dest_branch=$(echo "$DESTINATION_DOWNSTREAM_REPO" | cut -d: -f2)
          rebase_repo=$(echo "$REBASE_REPO" | cut -d: -f1)
          rebase_branch=$(echo "$REBASE_REPO" | cut -d: -f2)

          echo "Verifying: dest=${dest_repo}:${dest_branch} rebase=${rebase_repo}:${rebase_branch} upstream=${upstream_repo}:${upstream_ref}"

          set +e
          bash tools/verify-rebase.sh \
            "$dest_repo" "$dest_branch" \
            "$rebase_repo" "$rebase_branch" \
            "$upstream_repo" "$upstream_ref"
          rc=$?
          set -e

          echo "verify_rc=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" = "0" ]; then
            echo "::notice title=Verify (${TARGET})::All carry commits and downstream files preserved"
          else
            echo "::warning title=Verify (${TARGET})::Verification failed (rc=${rc})"
          fi

          exit 0

      - name: Post verification to PR
        if: always() && steps.verify.outcome == 'success' && steps.verify.outputs.verify_rc != '2'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.run.outputs.pr_url }}
        run: |
          [ -z "$PR_URL" ] && exit 0
          [ ! -f /tmp/verify-comment.md ] && exit 0

          pr_repo=$(echo "$PR_URL" | sed 's|https://github.com/||' | cut -d/ -f1-2)
          pr_number=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          marker="<!-- verify-rebase -->"
          body="$(printf '%s\n%s' "$marker" "$(cat /tmp/verify-comment.md)")"

          existing=$(gh api "repos/${pr_repo}/issues/${pr_number}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" 2>/dev/null | head -1)

          if [ -n "$existing" ]; then
            gh api "repos/${pr_repo}/issues/comments/${existing}" -X PATCH -f body="$body"
            echo "Updated existing verification comment"
          else
            gh api "repos/${pr_repo}/issues/${pr_number}/comments" -f body="$body"
            echo "Posted verification comment"
          fi

      # ── Phase 5: Result reporting ────────────────────────────
      - name: Save result
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ matrix.branch }}
          REASON: ${{ matrix.reason }}
          DRY_RUN_RC: ${{ steps.dry-run-retry.outputs.exit_code || steps.dry-run.outputs.exit_code }}
          DRY_RUN_VERIFY_RC: ${{ steps.verify-dry-run.outputs.verify_rc }}
          RUN_RC: ${{ steps.run.outputs.exit_code }}
          PR_URL: ${{ steps.run.outputs.pr_url }}
          PR_INFO: ${{ steps.run.outputs.pr_info }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
          TRIAGE_VERDICT: ${{ steps.triage.outputs.verdict }}
          VERIFY_RC: ${{ steps.verify.outputs.verify_rc }}
        run: |
          mkdir -p /tmp/results

          # Determine effective exit code and verify result
          if [ -n "$RUN_RC" ]; then
            exit_code="$RUN_RC"
          else
            exit_code="${DRY_RUN_RC:-1}"
          fi

          if [ -n "$VERIFY_RC" ] && [ "$VERIFY_RC" != "2" ]; then
            verify_result=$( [ "$VERIFY_RC" = "0" ] && echo "pass" || echo "fail" )
          elif [ -n "$DRY_RUN_VERIFY_RC" ] && [ "$DRY_RUN_VERIFY_RC" != "2" ]; then
            verify_result=$( [ "$DRY_RUN_VERIFY_RC" = "0" ] && echo "pass" || echo "fail" )
          else
            verify_result="skipped"
          fi

          jq -n \
            --arg target "$TARGET" \
            --arg branch "$BRANCH" \
            --arg reason "$REASON" \
            --arg exit_code "$exit_code" \
            --arg pr_url "${PR_URL:-}" \
            --arg pr_info "${PR_INFO:-}" \
            --arg verify "$verify_result" \
            '{target: $target, branch: $branch, reason: $reason, exit_code: $exit_code, pr_url: $pr_url, pr_info: $pr_info, verify: $verify}' \
            > "/tmp/results/${TARGET}.json"

          # Build job step summary
          echo "### Rebase: \`${TARGET}\` (\`${BRANCH}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${exit_code:-1}" = "0" ]; then
            status="✅ Success"
          elif grep -qE 'rebase/manual' /tmp/rebase-output.txt /tmp/rebase-output-retry.txt /tmp/rebase-output-real.txt 2>/dev/null; then
            status="⚠️ Manual intervention needed"
          else
            status="❌ Failed"
          fi

          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | ${REASON} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | exit ${DRY_RUN_RC:-n/a} |" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$TRIAGE_OUTCOME" ] && [ "$TRIAGE_OUTCOME" != "skipped" ]; then
            triage_reason=$(echo "$TRIAGE_VERDICT" | jq -r '.reason // "n/a"' 2>/dev/null || echo "n/a")
            triage_safe=$(echo "$TRIAGE_VERDICT" | jq -r '.safe // false' 2>/dev/null || echo "false")
            echo "| **Triage** | safe=${triage_safe} — ${triage_reason} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "| **Dry-run verify** | ${DRY_RUN_VERIFY_RC:+exit $DRY_RUN_VERIFY_RC}${DRY_RUN_VERIFY_RC:-skipped} |" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$RUN_RC" ]; then
            echo "| **Real run** | exit ${RUN_RC} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$PR_URL" ]; then
            echo "| **PR** | [${PR_INFO:-link}](${PR_URL}) |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$VERIFY_RC" ]; then
            echo "| **Post-push verify** | ${verify_result} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.target }}
          path: /tmp/results/
          retention-days: 7

      - name: Check outcome
        if: always()
        env:
          DRY_RUN_RC: ${{ steps.dry-run-retry.outputs.exit_code || steps.dry-run.outputs.exit_code }}
          DRY_RUN_VERIFY_RC: ${{ steps.verify-dry-run.outputs.verify_rc }}
          RUN_RC: ${{ steps.run.outputs.exit_code }}
          VERIFY_RC: ${{ steps.verify.outputs.verify_rc }}
          PR_URL: ${{ steps.run.outputs.pr_url }}
        run: |
          # Dry-run verification failed — block
          if [ "$DRY_RUN_VERIFY_RC" = "1" ]; then
            echo "::error::Dry-run verification failed — real run was blocked"
            exit 1
          fi

          # Dry-run itself failed (and triage didn't help)
          if [ "${DRY_RUN_RC:-1}" != "0" ]; then
            if grep -qE 'rebase/manual' /tmp/rebase-output.txt /tmp/rebase-output-retry.txt 2>/dev/null; then
              echo "::warning::Rebase needs manual intervention"
              exit 0
            fi
            echo "::error::Dry-run failed (rc=${DRY_RUN_RC})"
            exit 1
          fi

          # User requested dry-run only — success
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            exit 0
          fi

          # Real run result
          if [ "${RUN_RC:-1}" = "0" ]; then
            if [ -n "$PR_URL" ] && [ "$VERIFY_RC" = "1" ]; then
              echo "::warning::Post-push verification failed — check the PR comment for details"
            fi
            exit 0
          fi

          echo "::error::Real run failed (rc=${RUN_RC})"
          exit 1

  notify:
    needs: [decide, rebase]
    if: always() && (github.event_name == 'schedule' || inputs.notify_slack == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download results
        if: needs.decide.outputs.has_targets == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: /tmp/results
          merge-multiple: true

      - name: Build Slack payload
        id: payload
        env:
          HAS_TARGETS: ${{ needs.decide.outputs.has_targets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=""
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ -n "$RUN_URL" ] && args="$args --run-url $RUN_URL"
          [ "$HAS_TARGETS" != "true" ] && args="$args --no-targets"
          bash tools/auto-rebase/rebase-notify.sh /tmp/results $args > /tmp/slack-payload.json
          echo "Slack payload:"
          cat /tmp/slack-payload.json

