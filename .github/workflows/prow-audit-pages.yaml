name: Deploy Pages

on:
  push:
    branches: [oadp-dev, prow-merge-audit]
    paths:
      - 'tools/prow-merge-bot-configs/index.html'
      - 'tools/rebase-dashboard/**'
      - 'tools/rebase-dag/**'
      - 'tools/assemble-pages.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/rebase-dashboard/package-lock.json

      - name: Build Rebase Dashboard
        run: |
          cd tools/rebase-dashboard
          npm ci
          npm run build

      - name: Prepare pages directory
        run: bash tools/assemble-pages.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
