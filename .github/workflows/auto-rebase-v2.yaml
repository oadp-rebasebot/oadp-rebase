name: Auto Rebase

on:
  workflow_dispatch:
    inputs:
      oadp_1_3:
        description: 'oadp-1.3'
        type: boolean
        default: false
      oadp_1_4:
        description: 'oadp-1.4'
        type: boolean
        default: false
      oadp_1_5:
        description: 'oadp-1.5'
        type: boolean
        default: false
      oadp_1_6:
        description: 'oadp-1.6'
        type: boolean
        default: true
      oadp_dev:
        description: 'oadp-dev'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run only (no PRs created)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-rebase
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_targets: ${{ steps.build-matrix.outputs.has_targets }}
      branches: ${{ steps.build-matrix.outputs.branches }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: tools/rebase-status/go.sum

      - name: Build rebase-status
        run: make -C tools/rebase-status rebase-status

      - name: Determine targets
        id: build-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_OADP_1_3: ${{ inputs.oadp_1_3 }}
          INPUT_OADP_1_4: ${{ inputs.oadp_1_4 }}
          INPUT_OADP_1_5: ${{ inputs.oadp_1_5 }}
          INPUT_OADP_1_6: ${{ inputs.oadp_1_6 }}
          INPUT_OADP_DEV: ${{ inputs.oadp_dev }}
        run: |
          BRANCHES=""
          [ "$INPUT_OADP_1_3" = "true" ] && BRANCHES="$BRANCHES oadp-1.3"
          [ "$INPUT_OADP_1_4" = "true" ] && BRANCHES="$BRANCHES oadp-1.4"
          [ "$INPUT_OADP_1_5" = "true" ] && BRANCHES="$BRANCHES oadp-1.5"
          [ "$INPUT_OADP_1_6" = "true" ] && BRANCHES="$BRANCHES oadp-1.6"
          [ "$INPUT_OADP_DEV" = "true" ] && BRANCHES="$BRANCHES oadp-dev"
          BRANCHES="${BRANCHES# }"
          if [ -z "$BRANCHES" ]; then
            echo "::error::No branches selected"
            exit 1
          fi

          all_targets='[]'

          for branch in $BRANCHES; do
            echo "::group::rebase-status $branch"

            json_file="/tmp/status-${branch}.json"
            tools/rebase-status/rebase-status \
              --config-dir rebase-configs \
              --json \
              --hide-dependency-details \
              "$branch" > "$json_file" || true

            targets=$(bash tools/auto-rebase/rebase-decision.sh --reason < "$json_file")
            count=$(echo "$targets" | grep -c . || echo 0)
            echo "Branch $branch: $count target(s)"

            while IFS=$(printf '\t') read -r target reason; do
              [ -z "$target" ] && continue
              all_targets=$(echo "$all_targets" | jq \
                --arg branch "$branch" \
                --arg target "$target" \
                --arg reason "$reason" \
                '. + [{"branch": $branch, "target": $target, "reason": $reason}]')
            done <<< "$targets"

            echo "::endgroup::"
          done

          total=$(echo "$all_targets" | jq length)
          echo "Total targets across all branches: $total"

          if [ "$total" -gt 0 ]; then
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          fi

          matrix=$(echo "$all_targets" | jq -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"

          # Step summary
          status_files=""
          for branch in $BRANCHES; do
            [ -f "/tmp/status-${branch}.json" ] && status_files="$status_files /tmp/status-${branch}.json"
          done
          bash tools/auto-rebase/decide-summary.sh --targets "$all_targets" $status_files >> "$GITHUB_STEP_SUMMARY"

  rebase:
    needs: decide
    if: needs.decide.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.decide.outputs.matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install yq
        uses: mikefarah/yq@v4.46.1

      - name: Setup secrets
        env:
          APP_KEY: ${{ secrets.OADP_REBASEBOT_APP_KEY }}
          CLONER_KEY: ${{ secrets.OADP_REBASEBOT_CLONER_KEY }}
        run: |
          mkdir -p /tmp/rebasebot-secrets
          echo "$APP_KEY" > /tmp/rebasebot-secrets/oadp-rebasebot-app-key
          echo "$CLONER_KEY" > /tmp/rebasebot-secrets/oadp-rebasebot-cloner-key
          chmod 600 /tmp/rebasebot-secrets/*

      - name: Run rebase pipeline for ${{ matrix.target }}
        id: pipeline
        continue-on-error: true
        env:
          SECRETS_DIR: /tmp/rebasebot-secrets
          TARGET: ${{ matrix.target }}
        run: |
          flags=""
          [ "${{ inputs.dry_run }}" = "true" ] && flags="--dry-run-only"

          set +e
          bash tools/auto-rebase/run-rebase-pipeline.sh "$TARGET" $flags
          rc=$?
          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          # Read result JSON for downstream steps
          result_file="/tmp/results/${TARGET}.json"
          if [ -f "$result_file" ]; then
            echo "pr_url=$(jq -r '.pr_url // ""' "$result_file")" >> "$GITHUB_OUTPUT"
            echo "pr_info=$(jq -r '.pr_info // ""' "$result_file")" >> "$GITHUB_OUTPUT"
            echo "verify=$(jq -r '.verify // "skipped"' "$result_file")" >> "$GITHUB_OUTPUT"
            echo "is_manual=$(jq -r '.is_manual // false' "$result_file")" >> "$GITHUB_OUTPUT"
          fi

          exit $rc

      - name: Post-push verify
        if: always() && steps.pipeline.outputs.pr_url != ''
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
        run: |
          eval "$(bash tools/auto-rebase/resolve-config.sh "$TARGET")"

          if bash tools/verify-rebase.sh \
            "$DEST_REPO" "$DEST_BRANCH" \
            "$REBASE_REPO_SLUG" "$REBASE_BRANCH" \
            "$UPSTREAM_REPO" "$UPSTREAM_REF"; then
            echo "::notice title=Verify (${TARGET})::All carry commits and downstream files preserved"
          else
            echo "::warning title=Verify (${TARGET})::Post-push verification failed"
          fi

      - name: Job summary
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ matrix.branch }}
          REASON: ${{ matrix.reason }}
        run: |
          result_file="/tmp/results/${TARGET}.json"
          [ ! -f "$result_file" ] && { echo "No result file"; exit 0; }

          exit_code=$(jq -r '.exit_code' "$result_file")
          pr_url=$(jq -r '.pr_url // ""' "$result_file")
          pr_info=$(jq -r '.pr_info // ""' "$result_file")
          verify=$(jq -r '.verify' "$result_file")
          is_manual=$(jq -r '.is_manual' "$result_file")
          dry_run_rc=$(jq -r '.dry_run_rc' "$result_file")
          dry_run_policy=$(jq -r '.dry_run_policy' "$result_file")
          real_run_rc=$(jq -r '.real_run_rc // ""' "$result_file")

          if [ "$exit_code" = "0" ]; then
            status="✅ Success"
          elif [ "$is_manual" = "true" ]; then
            status="⚠️ Manual intervention needed"
          else
            status="❌ Failed"
          fi

          echo "### Rebase: \`${TARGET}\` (\`${BRANCH}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | ${REASON} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | exit ${dry_run_rc} (${dry_run_policy}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run verify** | ${verify} |" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$real_run_rc" ]; then
            echo "| **Real run** | exit ${real_run_rc} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$pr_url" ]; then
            echo "| **PR** | [${pr_info:-link}](${pr_url}) |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.target }}
          path: /tmp/results/
          retention-days: 7

      - name: Check outcome
        if: always()
        run: |
          result_file="/tmp/results/${{ matrix.target }}.json"
          [ ! -f "$result_file" ] && { echo "::error::No result file"; exit 1; }

          exit_code=$(jq -r '.exit_code' "$result_file")
          is_manual=$(jq -r '.is_manual' "$result_file")

          [ "$is_manual" = "true" ] && { echo "::warning::Rebase needs manual intervention"; exit 0; }
          [ "$exit_code" = "0" ] && exit 0

          echo "::error::Pipeline failed (rc=${exit_code})"
          exit 1

  log:
    needs: [decide, rebase]
    if: always() && needs.decide.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download result artifacts
        if: needs.decide.outputs.has_targets == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: /tmp/results
          merge-multiple: true

      - name: Clone wiki repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wiki_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git clone "$wiki_url" /tmp/wiki

      - name: Build and push log entry
        env:
          BRANCHES: ${{ needs.decide.outputs.branches }}
          MATRIX: ${{ needs.decide.outputs.matrix }}
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_TARGETS: ${{ needs.decide.outputs.has_targets }}
          REBASE_RESULT: ${{ needs.rebase.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          log_file="/tmp/wiki/Auto-Rebase-V2-Log.md"

          entry_file="/tmp/log-entry.md"
          {
            echo "## ${timestamp}"
            echo ""
            echo "**Run:** [#${{ github.run_number }}](${RUN_URL})"
            echo "**Triggered by:** ${ACTOR} (${EVENT})"
            echo "**Branches:** \`${BRANCHES}\`"
            echo "**Dry run:** ${DRY_RUN}"
            echo "**Overall result:** ${REBASE_RESULT}"
            echo ""

            if [ "$HAS_TARGETS" != "true" ]; then
              echo "_No rebase targets found._"
            else
              echo "| Target | Branch | Reason | Status | PR |"
              echo "|--------|--------|--------|--------|----|"

              echo "$MATRIX" | jq -r '.include[] | "\(.target)\t\(.branch)\t\(.reason)"' | \
              while IFS=$(printf '\t') read -r target branch reason; do
                result_file="/tmp/results/${target}.json"
                if [ -f "$result_file" ]; then
                  exit_code=$(jq -r '.exit_code' "$result_file")
                  is_manual=$(jq -r '.is_manual // false' "$result_file")
                  pr_url=$(jq -r '.pr_url // ""' "$result_file")
                  pr_info=$(jq -r '.pr_info // ""' "$result_file")

                  if [ "$exit_code" = "0" ]; then
                    status="✅ Success"
                  elif [ "$is_manual" = "true" ]; then
                    status="⚠️ Manual"
                  else
                    status="❌ Failed (rc=${exit_code})"
                  fi

                  if [ -n "$pr_url" ]; then
                    pr_col="[${pr_info:-link}](${pr_url})"
                  else
                    pr_col="—"
                  fi
                else
                  status="⚠️ No result"
                  pr_col="—"
                fi

                echo "| \`${target}\` | ${branch} | ${reason} | ${status} | ${pr_col} |"
              done
            fi

            echo ""
            echo "---"
            echo ""
          } > "$entry_file"

          # Prepend new entry after the title (newest first)
          if [ -f "$log_file" ]; then
            head -n 2 "$log_file" > /tmp/log-combined.md
            cat "$entry_file" >> /tmp/log-combined.md
            tail -n +3 "$log_file" >> /tmp/log-combined.md
            mv /tmp/log-combined.md "$log_file"
          else
            {
              echo "# Auto Rebase Log"
              echo ""
              cat "$entry_file"
            } > "$log_file"
          fi

          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to wiki"
          else
            git commit -m "Auto-rebase log ${timestamp}"
            git push
          fi
